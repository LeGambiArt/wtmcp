name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag matches VERSION
        run: |
          VERSION=$(cat VERSION)
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION file ($VERSION)"
            exit 1
          fi
          echo "Version validated: $TAG_VERSION"

      - name: Verify tag is on default branch
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME does not point to a commit on main"
            exit 1
          fi
          echo "Tag is on main"

  build:
    name: Build (${{ matrix.artifact }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64

          - os: ubuntu-24.04-arm
            artifact: linux-aarch64

          - os: macos-latest
            artifact: darwin-arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: 'go.mod'

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable
        with:
          toolchain: stable

      - name: Install cbindgen
        run: command -v cbindgen || cargo install cbindgen

      - name: Build and test
        run: |
          make build
          make test

      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARTIFACT="wtmcp-${VERSION}-${{ matrix.artifact }}"
          mkdir -p "$ARTIFACT/plugins"
          cp wtmcp wtmcpctl "$ARTIFACT/"
          for handler in plugins/*/handler; do
            [ -f "$handler" ] || continue
            plugin=$(dirname "$handler"); plugin=${plugin##*/}
            mkdir -p "$ARTIFACT/plugins/$plugin"
            cp "$handler" "$ARTIFACT/plugins/$plugin/"
          done
          tar czf "${ARTIFACT}.tar.gz" "$ARTIFACT"

      - name: Generate SBOM
        if: matrix.artifact == 'linux-x86_64'
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.8.0
          VERSION="${GITHUB_REF_NAME#v}"
          cyclonedx-gomod mod -json -output "wtmcp-${VERSION}-sbom.json"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            wtmcp-*.tar.gz
            wtmcp-*-sbom.json
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: |
          shopt -s nullglob
          sha256sum *.tar.gz | tee sha256sums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      - name: Sign artifacts
        working-directory: artifacts
        run: |
          shopt -s nullglob
          for f in *.tar.gz *.json sha256sums.txt; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes "$f" --bundle "${f}.cosign.bundle"
          done

      - name: Verify all artifacts are signed
        working-directory: artifacts
        run: |
          shopt -s nullglob
          for f in *.tar.gz *.json sha256sums.txt; do
            [ -f "$f" ] || continue
            [ -f "${f}.cosign.bundle" ] || { echo "::error::Missing signature for $f"; exit 1; }
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true
