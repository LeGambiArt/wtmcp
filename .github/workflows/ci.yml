name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install system dependencies
        run: sudo apt-get install -y libkrb5-dev

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cbindgen
            ~/.cargo/registry
            third_party/arapuca/target
          key: cargo-${{ runner.os }}-${{ hashFiles('third_party/arapuca/Cargo.toml', 'third_party/arapuca/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install cbindgen
        run: command -v cbindgen || cargo install cbindgen

      - name: Build libarapuca
        run: |
          make arapuca
          echo "PKG_CONFIG_PATH=${{ github.workspace }}/build/arapuca/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libkrb5-dev

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cbindgen
            ~/.cargo/registry
            third_party/arapuca/target
          key: cargo-${{ runner.os }}-${{ hashFiles('third_party/arapuca/Cargo.toml', 'third_party/arapuca/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install cbindgen
        run: command -v cbindgen || cargo install cbindgen

      - name: Build libarapuca
        run: |
          make arapuca
          echo "PKG_CONFIG_PATH=${{ github.workspace }}/build/arapuca/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Nosandbox stub tests
        run: make test-nosandbox

      - name: Vulnerability check
        if: runner.os == 'Linux'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          make govulncheck

      - name: Generate SBOM
        if: runner.os == 'Linux'
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.8.0
          cyclonedx-gomod mod -json -output wtmcp.sbom.json

      - name: Upload SBOM
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: wtmcp.sbom.json

  python:
    name: Python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest

      - name: Test Python plugins
        run: python -m pytest plugins/ -v
