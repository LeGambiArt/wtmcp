name: gitlab
version: "0.1.0"
description: "GitLab integration for repositories, MRs, pipelines, and issues"

execution: persistent
handler: ./handler
credential_group: gitlab
env_passthrough: all

services:
  auth:
    type: bearer
    token: "${GITLAB_TOKEN}"
    header: PRIVATE-TOKEN
    prefix: "none"
  http:
    base_url: "${GITLAB_URL}"
    # Required for internal/on-prem GitLab instances on private networks.
    # Cloud metadata endpoints (169.254.169.254 etc.) remain blocked by
    # the core's safedialer regardless of this setting.
    allow_private_ips: true

context_files:
  - context.md

env:
  # Listed for documentation; not used as filter when env_passthrough is "all"
  - GITLAB_TOKEN
  - GITLAB_URL

tools:
  - name: gitlab_get_commits
    access: read
    visibility: primary
    description: "Get commit logs from a project"
    params:
      instance:
        type: string
        description: "GitLab instance name (optional if only one configured)"
      project_id:
        type: string
        required: true
        description: "Project ID or path (e.g. 'group/project')"
      ref_name:
        type: string
        default: "main"
      since:
        type: string
        description: "ISO 8601 date to get commits after"
      until:
        type: string
        description: "ISO 8601 date to get commits before"
      path:
        type: string
        description: "File path to filter commits"
      author:
        type: string
        description: "Author email or name to filter"
      max_results:
        type: integer
        default: 20

  - name: gitlab_get_commit_diff
    access: read
    description: "Get diff for a specific commit"
    params:
      instance:
        type: string
      project_id:
        type: string
        required: true
      commit_sha:
        type: string
        required: true
      format:
        type: string
        default: "json"
        description: "'json' for structured data or 'patch' for unified diff"
      files_only:
        type: boolean
        default: false
        description: "Return only changed file paths, no diff content"
      max_files:
        type: integer
        default: 20
        description: "Maximum number of files to include"

  - name: gitlab_get_merge_request
    access: read
    visibility: primary
    description: "Get MR details with comments (diffs only with include_changes)"
    params:
      instance:
        type: string
      project_id:
        type: string
        required: true
      mr_iid:
        type: integer
        required: true
        description: "Merge request internal ID"
      include_changes:
        type: boolean
        default: false
        description: "Include file diffs (can be large)"
      include_system_notes:
        type: boolean
        default: false
        description: "Include system-generated notes"

  - name: gitlab_get_pipeline_jobs
    access: read
    description: "Get jobs from a CI/CD pipeline (logs for failed jobs only)"
    params:
      instance:
        type: string
      project_id:
        type: string
        required: true
      pipeline_id:
        type: integer
        required: true
      include_logs:
        type: boolean
        default: false
        description: "Include job logs (truncated at 50KB)"

  - name: gitlab_get_project_pipelines
    access: read
    description: "List recent pipelines for a project"
    params:
      instance:
        type: string
      project_id:
        type: string
        required: true
      ref:
        type: string
        description: "Branch/tag to filter"
      status:
        type: string
        description: "Pipeline status to filter"
      max_results:
        type: integer
        default: 10

  - name: gitlab_get_project_issues
    access: read
    description: "List issues with filtering options"
    params:
      instance:
        type: string
      project_id:
        type: string
        required: true
      state:
        type: string
        default: "all"
        description: "opened, closed, or all"
      assignee:
        type: string
        description: "Username of assignee"
      author:
        type: string
        description: "Username of author"
      labels:
        type: array
        items:
          type: string
      milestone:
        type: string
      search:
        type: string
      created_after:
        type: string
      created_before:
        type: string
      updated_after:
        type: string
      updated_before:
        type: string
      order_by:
        type: string
        default: "created_at"
      sort:
        type: string
        default: "desc"
      max_results:
        type: integer
        default: 20

  - name: gitlab_get_issue_details
    access: read
    description: "Get detailed issue information with notes"
    params:
      instance:
        type: string
      project_id:
        type: string
        required: true
      issue_iid:
        type: integer
        required: true
      include_notes:
        type: boolean
        default: true

  - name: gitlab_get_todos
    access: read
    visibility: primary
    description: >
      List your GitLab to-do items — MR reviews, assigned issues,
      mentions, and other actionable items across all projects. This
      is your unified task list. Filter by action, target type, or
      state. Paginated — use page parameter to navigate results.
    params:
      instance:
        type: string
      action:
        type: string
        description: "Filter: assigned, mentioned, build_failed, marked, etc."
      author_id:
        type: integer
      project_id:
        type: integer
      group_id:
        type: integer
      state:
        type: string
        default: "pending"
      target_type:
        type: string
        description: "Filter: Issue, MergeRequest, Commit, Epic"
      max_results:
        type: integer
        default: 20
      page:
        type: integer
        default: 1
        description: "Page number for pagination"

  - name: gitlab_my_issues
    access: read
    visibility: primary
    description: >
      List open issues assigned to you across all projects. Unlike
      gitlab_get_project_issues which requires a project_id, this
      searches globally.
    params:
      instance:
        type: string
        description: "GitLab instance name (optional if only one configured)"
      labels:
        type: array
        items:
          type: string
        description: "Filter by labels"
      sort:
        type: string
        default: "desc"
        description: "Sort direction: asc or desc"
      order_by:
        type: string
        default: "updated_at"
        description: "Order by: created_at, updated_at, priority, etc."
      max_results:
        type: integer
        default: 30

  - name: gitlab_list_merge_requests
    access: read
    visibility: primary
    description: "List merge requests with filtering"
    params:
      instance:
        type: string
      state:
        type: string
        default: "opened"
        description: "opened, closed, merged, or all"
      scope:
        type: string
        description: "created_by_me or assigned_to_me"
      author_username:
        type: string
      assignee_username:
        type: string
        description: "Filter by assignee username"
      reviewer_username:
        type: string
      project_id:
        type: string
        description: "Limit to a specific project"
      labels:
        type: array
        items:
          type: string
      milestone:
        type: string
      search:
        type: string
      source_branch:
        type: string
      target_branch:
        type: string
      order_by:
        type: string
        default: "created_at"
      sort:
        type: string
        default: "desc"
      max_results:
        type: integer
        default: 20

  - name: gitlab_get_file_contents
    access: read
    description: >
      Get file contents from a repository. Returns decoded text for
      files (capped at 50KB) or metadata only for large/binary files.
    params:
      instance:
        type: string
      project_id:
        type: string
        required: true
        description: "Project ID or path (e.g. 'group/project')"
      path:
        type: string
        required: true
        description: "Path to file in the repository"
      ref:
        type: string
        description: "Branch, tag, or commit SHA (default: project default branch)"

  - name: gitlab_search_projects
    access: read
    description: >
      Search for projects by name or description. Returns project
      metadata including path, default branch, and activity.
    params:
      instance:
        type: string
      query:
        type: string
        required: true
        description: "Search query"
      max_results:
        type: integer
        default: 30

  - name: gitlab_search_code
    access: read
    description: >
      Search for code within a project. Returns matching file paths,
      line numbers, and code snippets.
    params:
      instance:
        type: string
      project_id:
        type: string
        required: true
        description: "Project ID or path (e.g. 'group/project')"
      query:
        type: string
        required: true
        description: "Search query"
      max_results:
        type: integer
        default: 30

  - name: gitlab_create_merge_request
    access: write
    description: >
      Create a new merge request. Defaults to dry_run=true which returns a
      preview without creating. Set dry_run=false to create.
    params:
      instance:
        type: string
      project_id:
        type: string
        required: true
        description: "Project ID or path (e.g. 'group/project')"
      source_branch:
        type: string
        required: true
        description: "Branch to merge from"
      target_branch:
        type: string
        required: true
        description: "Branch to merge into"
      title:
        type: string
        required: true
        description: "MR title"
      description:
        type: string
        description: "MR description body"
      labels:
        type: array
        items:
          type: string
        description: "Labels to apply"
      remove_source_branch:
        type: boolean
        description: "Delete source branch on merge"
      squash:
        type: boolean
        description: "Squash commits on merge"
      draft:
        type: boolean
        default: false
        description: "Create as draft MR (prepends 'Draft: ' to title)"
      dry_run:
        type: boolean
        default: true
        description: "Preview without creating (default: true)"

  - name: gitlab_create_branch
    access: write
    description: >
      Create a new branch from a source branch. Validates branch name
      against git check-ref-format rules. Defaults to dry_run=true.
    params:
      instance:
        type: string
      project_id:
        type: string
        required: true
        description: "Project ID or path (e.g. 'group/project')"
      branch_name:
        type: string
        required: true
        description: "Name for the new branch"
      source_branch:
        type: string
        default: "main"
        description: "Branch to create from (default: main)"
      dry_run:
        type: boolean
        default: true
        description: "Preview without creating (default: true)"

  - name: gitlab_create_or_update_file
    access: write
    description: >
      Create or update a file in a repository. Checks if the file
      exists to determine create vs update. Content is plain text.
      Defaults to dry_run=true.
    params:
      instance:
        type: string
      project_id:
        type: string
        required: true
        description: "Project ID or path (e.g. 'group/project')"
      path:
        type: string
        required: true
        description: "File path in the repository"
      content:
        type: string
        required: true
        description: "File content (plain text)"
      message:
        type: string
        required: true
        description: "Commit message"
      branch:
        type: string
        description: "Target branch (default: project default branch)"
      dry_run:
        type: boolean
        default: true
        description: "Preview without creating (default: true)"

  - name: gitlab_create_mr_discussion
    access: write
    description: >
      Post an inline discussion comment on an MR diff line. Requires
      new_path and at least one of new_line (added/context lines) or
      old_line (removed/context lines). DiffRefs SHAs are auto-fetched
      from the MR if any is omitted (provide all three or none).
      Defaults to dry_run=true.
    params:
      instance:
        type: string
      project_id:
        type: string
        required: true
        description: "Project ID or path (e.g. 'group/project')"
      mr_iid:
        type: integer
        required: true
        description: "Merge request internal ID"
      body:
        type: string
        required: true
        description: "Comment text (markdown)"
      new_path:
        type: string
        required: true
        description: "File path in the new version of the diff"
      old_path:
        type: string
        description: "File path in old version (defaults to new_path)"
      new_line:
        type: integer
        description: "Line number in the new file (for added/context lines)"
      old_line:
        type: integer
        description: "Line number in the old file (for removed/context lines)"
      base_sha:
        type: string
        description: "Base commit SHA (auto-fetched from MR if omitted)"
      head_sha:
        type: string
        description: "Head commit SHA (auto-fetched from MR if omitted)"
      start_sha:
        type: string
        description: "Start commit SHA (auto-fetched from MR if omitted)"
      dry_run:
        type: boolean
        default: true
        description: "Preview without posting (default: true)"

  - name: gitlab_add_mr_note
    access: write
    description: >
      Post a general comment on an MR (not inline). Use this for
      overall feedback or summary comments. Defaults to dry_run=true.
    params:
      instance:
        type: string
      project_id:
        type: string
        required: true
        description: "Project ID or path (e.g. 'group/project')"
      mr_iid:
        type: integer
        required: true
        description: "Merge request internal ID"
      body:
        type: string
        required: true
        description: "Comment text (markdown)"
      dry_run:
        type: boolean
        default: true
        description: "Preview without posting (default: true)"
